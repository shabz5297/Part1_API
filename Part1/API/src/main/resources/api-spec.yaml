openapi: 3.0.3
info:
  title: SafeDispatch HQ Administration API
  description: >
    RESTful API for HQ administrators to manage employees, departments,
    and assignments. Secured with HTTPS and role-based access control.
  version: 1.0.0

servers:
  - url: https://localhost:8443
    description: Local development server (HTTPS)

security:
  - basicAuth: []

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:
    Employee:
      type: object
      required:
        - name
        - contractType
        - email
        - startDate
        - salary
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        name:
          type: string
          example: "Jane Smith"
        email:
          type: string
          format: email
          example: "jane.smith@safedispatch.com"
        contractType:
          type: string
          example: "FULL_TIME"
        startDate:
          type: string
          format: date
          example: "2023-01-15"
        salary:
          type: integer
          example: 35000
        role:
          type: string
          example: "ROLE_HR"

    Department:
      type: object
      required:
        - name
        - budget
        - location
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        name:
          type: string
          example: "Logistics"
        budget:
          type: integer
          minimum: 1
          example: 500000
        location:
          type: string
          example: "Leicester"

    Assignment:
      type: object
      required:
        - employeeId
        - departmentId
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        employeeId:
          type: integer
          format: int64
          example: 2
        departmentId:
          type: integer
          format: int64
          example: 3
        role:
          type: string
          example: "Fleet Coordinator"
        accessLevel:
          type: string
          example: "LEVEL_2"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Employee not found"

paths:

  /api/employees:
    get:
      summary: List all employees
      description: Returns all employees. Optionally filter by department name.
      operationId: getAllEmployees
      tags: [Employees]
      parameters:
        - name: department
          in: query
          required: false
          schema:
            type: string
          description: Filter employees by department name
          example: "Logistics"
      responses:
        '200':
          description: A list of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new employee
      description: Creates a new employee record. HR only.
      operationId: createEmployee
      tags: [Employees]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
            example:
              name: "John Doe"
              email: "john.doe@safedispatch.com"
              contractType: "FULL_TIME"
              startDate: "2024-03-01"
              salary: 30000
              role: "ROLE_MANAGER"
      responses:
        '201':
          description: Employee created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
        '403':
          description: Forbidden - HR role required

  /api/employees/{id}:
    get:
      summary: Get employee by ID
      operationId: getEmployee
      tags: [Employees]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Employee found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised

    put:
      summary: Update an employee
      description: Updates employee details. HR only.
      operationId: updateEmployee
      tags: [Employees]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '200':
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
        '403':
          description: Forbidden - HR role required

    delete:
      summary: Delete an employee
      description: Removes an employee record. HR only.
      operationId: deleteEmployee
      tags: [Employees]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Employee deleted successfully
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
        '403':
          description: Forbidden - HR role required

  /api/employees/{id}/promote:
    put:
      summary: Promote an employee
      description: >
        Applies a 10% salary increase and updates the employee's role.
        Returns 400 if the employee started less than 6 months ago. HR only.
      operationId: promoteEmployee
      tags: [Employees]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Employee promoted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          description: Employee not eligible for promotion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Employee not eligible for promotion"
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
        '403':
          description: Forbidden - HR role required

  /api/departments:
    get:
      summary: List all departments
      operationId: getAllDepartments
      tags: [Departments]
      responses:
        '200':
          description: A list of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
        '401':
          description: Unauthorised

    post:
      summary: Create a new department
      description: Creates a department. Budget must be positive. HR only.
      operationId: createDepartment
      tags: [Departments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
            example:
              name: "Logistics"
              budget: 250000
              location: "Leicester"
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          description: Budget must be positive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Budget must be positive"
        '401':
          description: Unauthorised
        '403':
          description: Forbidden - HR role required

  /api/assignments:
    post:
      summary: Assign an employee to a department
      description: Links an employee to a department with a role and access level. HR only.
      operationId: createAssignment
      tags: [Assignments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assignment'
            example:
              employeeId: 1
              departmentId: 2
              role: "Fleet Coordinator"
              accessLevel: "LEVEL_2"
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '404':
          description: Employee or Department not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
        '403':
          description: Forbidden - HR role required

  /api/assignments/{id}:
    delete:
      summary: Delete an assignment
      description: Removes an employee-department assignment. HR only.
      operationId: deleteAssignment
      tags: [Assignments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Assignment deleted
        '404':
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
        '403':
          description: Forbidden - HR role required
